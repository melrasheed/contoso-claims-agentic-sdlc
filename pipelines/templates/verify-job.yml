# =============================================================================
# templates/verify-job.yml — Smoke/integration tests against a deployed env
# =============================================================================
parameters:
  - name: apiBaseUrl
    type: string
  - name: environment
    type: string
    default: 'dev'

jobs:
  - job: Verify_${{ parameters.environment }}
    displayName: 'Smoke Tests — ${{ parameters.environment }}'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: NodeTool@0
        displayName: 'Use Node 20.x'
        inputs:
          versionSpec: '20.x'

      - script: |
          set -euo pipefail
          BASE_URL="${{ parameters.apiBaseUrl }}"

          echo "==> Verifying health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "##[error] /health returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "  ✓ /health → $STATUS"

          echo "==> Verifying /api/claims endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/claims" || echo "000")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "##[error] /api/claims returned HTTP $STATUS (expected 200 or 401)"
            exit 1
          fi
          echo "  ✓ /api/claims → $STATUS"

          echo "==> All smoke tests passed for ${{ parameters.environment }}."
        displayName: 'Smoke test: /health and /api/claims'
