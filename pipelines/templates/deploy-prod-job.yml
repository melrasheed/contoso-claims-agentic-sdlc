# =============================================================================
# templates/deploy-prod-job.yml — Prod deployment with slot swap + rollback
#
# Strategy:
#   1. Deploy Bicep (enableSlots=true, S1 plan)
#   2. Build + deploy API to the STAGING slot
#   3. Health check the staging slot
#   4. Swap staging → production
#   5. Post-swap health check against production
#   6. If post-swap health fails → swap back (rollback)
# =============================================================================
parameters:
  - name: environment
    type: string
    default: 'prod'
  - name: azureServiceConnection
    type: string
  - name: artifactName
    type: string
    default: 'drop'
  - name: subscriptionId
    type: string
  - name: resourceGroup
    type: string
  - name: location
    type: string
    default: 'eastus'
  - name: namePrefix
    type: string
    default: 'contoso'
  - name: viteApiBaseUrl
    type: string
    default: ''
  - name: alertEmail
    type: string
    default: 'ops-team@example.com'

jobs:
  - deployment: Deploy_prod
    displayName: 'Deploy to Production (slot swap)'
    # The "prod" environment has Approvals + Checks configured in the portal.
    # See pipelines/README.md §Gates for required checks.
    environment: ${{ parameters.environment }}
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: ${{ parameters.artifactName }}
              displayName: 'Download build artifact'

            # -----------------------------------------------------------------
            # 1. Deploy Bicep (prod — enableSlots=true forces S1)
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: '1 · Deploy Bicep infrastructure (prod)'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  RG="${{ parameters.resourceGroup }}"
                  LOCATION="${{ parameters.location }}"
                  BICEP_FILE="$(Pipeline.Workspace)/${{ parameters.artifactName }}/infra/main.bicep"
                  PARAMS_FILE="$(Pipeline.Workspace)/${{ parameters.artifactName }}/infra/main.parameters.prod.json"

                  echo "==> Ensuring resource group: $RG"
                  az group create \
                    --name "$RG" --location "$LOCATION" \
                    --subscription "${{ parameters.subscriptionId }}" \
                    --tags "project=agentic-sdlc" "env=prod" "managedBy=bicep" \
                    --output none

                  echo "==> Deploying Bicep (prod, slots enabled)..."
                  az deployment group create \
                    --name "pipeline-prod-$(Build.BuildId)" \
                    --resource-group "$RG" \
                    --subscription "${{ parameters.subscriptionId }}" \
                    --template-file "$BICEP_FILE" \
                    --parameters "@$PARAMS_FILE" \
                    --parameters \
                      namePrefix="${{ parameters.namePrefix }}" \
                      environmentName="prod" \
                      enableSlots="true" \
                      viteApiBaseUrl="${{ parameters.viteApiBaseUrl }}" \
                      alertEmailAddress="${{ parameters.alertEmail }}" \
                    --output json \
                    --query "properties.outputs"

            # -----------------------------------------------------------------
            # 2. Deploy API to STAGING slot
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: '2 · Deploy API → staging slot'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  APP_NAME="${{ parameters.namePrefix }}-api-prod"
                  ARTIFACT_PATH="$(Pipeline.Workspace)/${{ parameters.artifactName }}/api"

                  cd "$ARTIFACT_PATH"
                  npm ci --omit=dev
                  zip -r /tmp/api-prod.zip . -x "*.git*"

                  echo "==> Deploying API to staging slot of $APP_NAME..."
                  az webapp deploy \
                    --resource-group "${{ parameters.resourceGroup }}" \
                    --name "$APP_NAME" \
                    --slot staging \
                    --src-path /tmp/api-prod.zip \
                    --type zip \
                    --subscription "${{ parameters.subscriptionId }}"

            # -----------------------------------------------------------------
            # 3. Health check against STAGING slot
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: '3 · Health check staging slot'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  APP_NAME="${{ parameters.namePrefix }}-api-prod"
                  STAGING_URL="https://${APP_NAME}-staging.azurewebsites.net/health"

                  echo "==> Waiting for staging slot to start..."
                  sleep 30

                  echo "==> Checking staging health: $STAGING_URL"
                  for i in 1 2 3 4 5; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL" || echo "000")
                    echo "  Attempt $i: HTTP $STATUS"
                    if [ "$STATUS" = "200" ]; then
                      echo "==> Staging slot is healthy."
                      exit 0
                    fi
                    sleep 15
                  done
                  echo "##[error] Staging slot health check failed after 5 attempts."
                  exit 1

            # -----------------------------------------------------------------
            # 4. Swap staging → production
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: '4 · Swap staging → production'
              name: SlotSwap
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  APP_NAME="${{ parameters.namePrefix }}-api-prod"

                  echo "==> Swapping staging → production for $APP_NAME..."
                  az webapp deployment slot swap \
                    --resource-group "${{ parameters.resourceGroup }}" \
                    --name "$APP_NAME" \
                    --slot staging \
                    --target-slot production \
                    --subscription "${{ parameters.subscriptionId }}"

                  echo "==> Swap complete."
                  # Export the app name for subsequent steps
                  echo "##vso[task.setvariable variable=ApiAppName;isOutput=true]$APP_NAME"

            # -----------------------------------------------------------------
            # 5. Post-swap health check against PRODUCTION slot
            #    If this fails → step 6 swaps back (rollback)
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: '5 · Post-swap health check (production)'
              name: ProdHealthCheck
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  APP_NAME="${{ parameters.namePrefix }}-api-prod"
                  PROD_URL="https://${APP_NAME}.azurewebsites.net/health"

                  echo "==> Waiting for production to stabilise..."
                  sleep 20

                  HEALTHY=false
                  for i in 1 2 3; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || echo "000")
                    echo "  Attempt $i: HTTP $STATUS"
                    if [ "$STATUS" = "200" ]; then
                      HEALTHY=true
                      break
                    fi
                    sleep 20
                  done

                  if [ "$HEALTHY" = "true" ]; then
                    echo "==> Production health check passed."
                    echo "##vso[task.setvariable variable=ProdHealthy;isOutput=true]true"
                  else
                    echo "##[warning] Production health check failed. Rollback will be triggered."
                    echo "##vso[task.setvariable variable=ProdHealthy;isOutput=true]false"
                    exit 1
                  fi

            # -----------------------------------------------------------------
            # 6. ROLLBACK — swap back if post-swap health check failed
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: '6 · ROLLBACK — swap back to previous version'
              condition: failed()   # Only runs if step 5 fails
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  APP_NAME="${{ parameters.namePrefix }}-api-prod"

                  echo "##[section] ROLLBACK INITIATED"
                  echo "==> Swapping production back to previous version (staging contains the bad build)..."
                  az webapp deployment slot swap \
                    --resource-group "${{ parameters.resourceGroup }}" \
                    --name "$APP_NAME" \
                    --slot staging \
                    --target-slot production \
                    --subscription "${{ parameters.subscriptionId }}"

                  echo "==> Rollback swap complete. Verifying production restored..."
                  sleep 15
                  PROD_URL="https://${APP_NAME}.azurewebsites.net/health"
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || echo "000")
                  echo "==> Post-rollback health: HTTP $STATUS"

                  # Fail the pipeline so the deployment is marked as failed
                  echo "##[error] Deployment rolled back due to post-swap health check failure."
                  exit 1

            # -----------------------------------------------------------------
            # Deploy Web SPA to production Web App
            # (SPA has no slot — deploy directly)
            # -----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Deploy Web SPA to production'
              condition: succeeded()
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail
                  APP_NAME="${{ parameters.namePrefix }}-web-prod"
                  ARTIFACT_PATH="$(Pipeline.Workspace)/${{ parameters.artifactName }}/web"

                  cd "$ARTIFACT_PATH"
                  if [ ! -f package.json ]; then
                    echo '{"name":"web","version":"1.0.0"}' > package.json
                  fi
                  npm install serve --save --prefer-offline 2>/dev/null || true
                  zip -r /tmp/web-prod.zip . -x "*.git*"

                  echo "==> Deploying Web SPA to $APP_NAME..."
                  az webapp deploy \
                    --resource-group "${{ parameters.resourceGroup }}" \
                    --name "$APP_NAME" \
                    --src-path /tmp/web-prod.zip \
                    --type zip \
                    --subscription "${{ parameters.subscriptionId }}"
