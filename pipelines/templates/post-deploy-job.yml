# =============================================================================
# templates/post-deploy-job.yml — Health/telemetry verification + release note
# =============================================================================
parameters:
  - name: azureServiceConnection
    type: string
  - name: subscriptionId
    type: string
  - name: resourceGroup
    type: string
  - name: namePrefix
    type: string
    default: 'contoso'
  - name: apiBaseUrl
    type: string

jobs:
  - job: PostDeploy
    displayName: 'Post-Deploy Verification'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - script: |
          set -euo pipefail
          BASE_URL="${{ parameters.apiBaseUrl }}"

          echo "==> Final production health check..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/health" || echo "000")
          echo "  /health → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "##[error] Production health check failed post-deploy."
            exit 1
          fi
          echo "  ✓ Production health verified."
        displayName: 'Production health check'

      # -----------------------------------------------------------------------
      # Application Insights Release Annotation
      # Annotates the App Insights timeline with this release.
      # -----------------------------------------------------------------------
      - task: AzureCLI@2
        displayName: 'App Insights release annotation'
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            set -euo pipefail
            AI_NAME="${{ parameters.namePrefix }}-ai-prod"
            RG="${{ parameters.resourceGroup }}"
            BUILD_ID="$(Build.BuildId)"
            RELEASE_NAME="Release-${BUILD_ID}"
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

            AI_ID=$(az monitor app-insights component show \
              --app "$AI_NAME" \
              --resource-group "$RG" \
              --subscription "${{ parameters.subscriptionId }}" \
              --query "id" -o tsv 2>/dev/null || echo "")

            if [ -z "$AI_ID" ]; then
              echo "##[warning] Could not find App Insights component $AI_NAME — skipping annotation."
              exit 0
            fi

            ANNOTATION_JSON=$(cat <<EOF
            {
              "AnnotationName": "$RELEASE_NAME",
              "EventTime": "$TIMESTAMP",
              "Category": "Deployment",
              "Properties": "{\"BuildId\":\"${BUILD_ID}\",\"BuildNumber\":\"$(Build.BuildNumber)\",\"SourceBranch\":\"$(Build.SourceBranchName)\"}"
            }
            EOF
            )

            az rest \
              --method POST \
              --url "https://management.azure.com${AI_ID}/Annotations?api-version=2015-05-01" \
              --body "$ANNOTATION_JSON" \
              --output none

            echo "  ✓ Release annotation '$RELEASE_NAME' created in $AI_NAME."

      - script: |
          echo "##[section] Post-Deploy Summary"
          echo "  Build:       $(Build.BuildNumber)"
          echo "  Branch:      $(Build.SourceBranchName)"
          echo "  API URL:     ${{ parameters.apiBaseUrl }}"
          echo "  Deployed at: $(date -u)"
          echo "  ✓ Deployment pipeline complete."
        displayName: 'Summary'
