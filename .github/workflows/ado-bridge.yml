# Syncs Azure Boards work items tagged `ai-ready` into GitHub issues and hands them
# to the Copilot coding agent, then writes the results back to Azure Boards.
name: ADO Bridge

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      workItemIds:
        description: 'Comma-separated Azure Boards work item ids to sync (empty = all ai-ready items)'
        required: false
        type: string
      dryRun:
        description: 'Log what would happen without writing to GitHub or Azure Boards'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

# A sync run must never be cancelled halfway through: it writes back to Azure Boards.
concurrency:
  group: ado-bridge
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Azure Boards -> GitHub issues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADO_ORG: ${{ vars.ADO_ORG || 'melrasheed' }}
      ADO_PROJECT: ${{ vars.ADO_PROJECT || 'Agentic SDLC' }}
      GH_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
      GH_REPO: ${{ vars.GH_REPO || 'contoso-claims-agentic-sdlc' }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
      # The default GITHUB_TOKEN cannot assign the Copilot coding agent to an issue:
      # `suggestedActors(capabilities: [CAN_BE_ASSIGNED])` never returns `copilot-swe-agent`
      # for the Actions token. Set the BRIDGE_GITHUB_TOKEN secret to a PAT (classic: repo +
      # workflow, or fine-grained with Issues: Read and write) for real assignment; without
      # it the bridge still creates issues but leaves them unassigned.
      GITHUB_TOKEN: ${{ secrets.BRIDGE_GITHUB_TOKEN || github.token }}
      # `inputs.dryRun || 'true'` would coerce an explicit `false` back to `'true'`,
      # so the event type is checked first and only workflow_dispatch can disable dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dryRun && 'true' || 'false') || 'true' }}
      WORK_ITEM_IDS: ${{ inputs.workItemIds }}
    steps:
      # `secrets` is not available in a job-level `if`, so the guard runs as the first step
      # and every later step is conditional on its output.
      - name: Guard - require ADO_PAT
        id: guard
        run: |
          if [ -z "${ADO_PAT}" ]; then
            echo "ADO_PAT secret is not set - skipping the Azure Boards sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Build bridge
        if: steps.guard.outputs.enabled == 'true'
        run: npm run build --workspace @contoso/ado-github-bridge

      - name: Run bridge
        if: steps.guard.outputs.enabled == 'true'
        run: npm run start --workspace @contoso/ado-github-bridge
